<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điểm sinh viên</title>
</head>
<body>
    <h1>Bảng điểm sinh viên</h1>

    <table border="1">
        <caption>Kết quả học tập</caption>
        <thead>
            <tr>
                <th scope="col">STT</th>
                <th scope="col">Môn học</th>
                <th scope="col">Điểm</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Toán</td>
                <td>8.5</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Ngữ văn</td>
                <td>7.0</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Tiếng Anh</td>
                <td>9.0</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Vật lý</td>
                <td>6.5</td>
            </tr>
            <tr>
                <td>5</td>
                <td>Tin học</td>
                <td>8.0</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th scope="row">&nbsp;</th>
                <th scope="row">Điểm trung bình</th>
                <td>7.8</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
